name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            -PAMBIGOVEE_REPO="${GITHUB_REPOSITORY}" \
            --stacktrace

      - name: Verify Android TV launcher
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/34.0.0/aapt"

          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep -F "package: name='fr.ambigovee.tv'"
          echo "$BADGING" | grep -F "launchable-activity: name='fr.ambigovee.tv.MainActivity'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbiGoveeTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
