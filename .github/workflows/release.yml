name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publier (ex: 1.7.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ambigovee-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide. Utilise par exemple 1.7.3"
            exit 1
          fi

          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Le tag ${TAG} existe deja."
            exit 1
          fi

          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name n'est pas configure."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/ambigovee-release.jks"
          test -s "$GITHUB_WORKSPACE/ambigovee-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          AMBIGOVEE_KEYSTORE: ${{ github.workspace }}/ambigovee-release.jks
          AMBIGOVEE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AMBIGOVEE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AMBIGOVEE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease \
            -PAMBIGOVEE_REPO="${GITHUB_REPOSITORY}" \
            -PAMBIGOVEE_VERSION_NAME="${VERSION_NAME}" \
            -PAMBIGOVEE_VERSION_CODE="${VERSION_CODE}" \
            --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK and TV launcher
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          AAPT="${BUILD_TOOLS}/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | head -n 12

          echo "$BADGING" | grep -F "package: name='fr.ambigovee.tv'"
          echo "$BADGING" | grep -F "versionCode='${VERSION_CODE}'"
          echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'"

          # Bloque la release si Android TV ne voit plus l'activité launchable.
          echo "$BADGING" | grep -F "launchable-activity: name='fr.ambigovee.tv.MainActivity'"

      - name: Prepare release files
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          cp app/build/outputs/apk/release/app-release.apk AmbiGoveeTV.apk

          rm -rf release-bundle
          mkdir -p release-bundle

          cp AmbiGoveeTV.apk release-bundle/
          cp release-installer/INSTALLER_WINDOWS.bat release-bundle/
          cp release-installer/install-prebuilt.ps1 release-bundle/

          (
            cd release-bundle
            zip -r ../AmbiGoveeTV-Windows.zip .
          )

          cp AmbiGoveeTV.apk "AmbiGoveeTV-${TAG}.apk"
          cp AmbiGoveeTV-Windows.zip "AmbiGoveeTV-${TAG}-Windows.zip"

          sha256sum \
            AmbiGoveeTV.apk \
            AmbiGoveeTV-Windows.zip \
            "AmbiGoveeTV-${TAG}.apk" \
            "AmbiGoveeTV-${TAG}-Windows.zip" \
            > SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            AmbiGoveeTV.apk \
            AmbiGoveeTV-Windows.zip \
            "AmbiGoveeTV-${TAG}.apk" \
            "AmbiGoveeTV-${TAG}-Windows.zip" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AmbiGoveeTV ${TAG}" \
            --generate-notes \
            --latest
