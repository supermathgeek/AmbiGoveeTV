name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name n'est pas configure dans Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/ambigovee-release.jks"
          test -s "$GITHUB_WORKSPACE/ambigovee-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          AMBIGOVEE_KEYSTORE: ${{ github.workspace }}/ambigovee-release.jks
          AMBIGOVEE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AMBIGOVEE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AMBIGOVEE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease             -PAMBIGOVEE_REPO="${GITHUB_REPOSITORY}"             --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Prepare downloads
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk AmbiGoveeTV.apk

          rm -rf release-bundle
          mkdir -p release-bundle
          cp AmbiGoveeTV.apk release-bundle/
          cp release-installer/INSTALLER_WINDOWS.bat release-bundle/
          cp release-installer/install-prebuilt.ps1 release-bundle/

          cd release-bundle
          zip -r ../AmbiGoveeTV-Windows.zip .
          cd ..

          cp AmbiGoveeTV.apk "AmbiGoveeTV-${GITHUB_REF_NAME}.apk"
          cp AmbiGoveeTV-Windows.zip "AmbiGoveeTV-${GITHUB_REF_NAME}-Windows.zip"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME"               AmbiGoveeTV.apk               AmbiGoveeTV-Windows.zip               "AmbiGoveeTV-${GITHUB_REF_NAME}.apk"               "AmbiGoveeTV-${GITHUB_REF_NAME}-Windows.zip"               --clobber
          else
            gh release create "$GITHUB_REF_NAME"               AmbiGoveeTV.apk               AmbiGoveeTV-Windows.zip               "AmbiGoveeTV-${GITHUB_REF_NAME}.apk"               "AmbiGoveeTV-${GITHUB_REF_NAME}-Windows.zip"               --title "AmbiGoveeTV ${GITHUB_REF_NAME}"               --generate-notes               --latest
          fi
