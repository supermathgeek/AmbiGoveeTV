name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (example: 1.9.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ambigovee-release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version. Example: 1.9.0"
            exit 1
          fi

          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

  android:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/ambigovee-release.jks"
          test -s "$GITHUB_WORKSPACE/ambigovee-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          AMBIGOVEE_KEYSTORE: ${{ github.workspace }}/ambigovee-release.jks
          AMBIGOVEE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AMBIGOVEE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AMBIGOVEE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.meta.outputs.version }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease \
            -PAMBIGOVEE_REPO="${GITHUB_REPOSITORY}" \
            -PAMBIGOVEE_VERSION_NAME="${VERSION_NAME}" \
            -PAMBIGOVEE_VERSION_CODE="${VERSION_CODE}" \
            --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK and Android TV launcher
        shell: bash
        env:
          VERSION_NAME: ${{ needs.meta.outputs.version }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          AAPT="${BUILD_TOOLS}/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING" | grep -F "package: name='fr.ambigovee.tv'"
          echo "$BADGING" | grep -F "versionCode='${VERSION_CODE}'"
          echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'"
          echo "$BADGING" | grep -F "launchable-activity: name='fr.ambigovee.tv.MainActivity'"

          cp "$APK" AmbiGoveeTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: AmbiGoveeTV.apk
          if-no-files-found: error

  installers:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: windows
            artifact: installer-windows
          - os: macos-latest
            kind: mac-arm
            artifact: installer-macos-arm
          - os: macos-15-intel
            kind: mac-intel
            artifact: installer-macos-intel
          - os: ubuntu-24.04
            kind: linux-x64
            artifact: installer-linux-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer self-test
        shell: bash
        run: python installer/ambigovee_installer.py --self-test

      - name: Install PyInstaller
        shell: bash
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.2

      - name: Build Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name AmbiGovee-Installer `
            installer/ambigovee_installer.py

          Move-Item dist/AmbiGovee-Installer.exe AmbiGovee-Installer-Windows.exe

      - name: Build macOS installer
        if: startsWith(matrix.kind, 'mac-')
        shell: bash
        run: |
          set -euo pipefail

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "AmbiGovee Installer" \
            installer/ambigovee_installer.py

          if [ "${{ matrix.kind }}" = "mac-arm" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/AmbiGovee Installer.app" \
              "AmbiGovee-Installer-macOS-Apple-Silicon.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/AmbiGovee Installer.app" \
              "AmbiGovee-Installer-macOS-Intel.zip"
          fi

      - name: Build Linux installer
        if: matrix.kind == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name AmbiGovee-Installer \
            installer/ambigovee_installer.py

          chmod +x dist/AmbiGovee-Installer
          tar -C dist -czf AmbiGovee-Installer-Linux-x86_64.tar.gz AmbiGovee-Installer

      - name: Upload Windows installer
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AmbiGovee-Installer-Windows.exe
          if-no-files-found: error

      - name: Upload macOS Apple Silicon installer
        if: matrix.kind == 'mac-arm'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AmbiGovee-Installer-macOS-Apple-Silicon.zip
          if-no-files-found: error

      - name: Upload macOS Intel installer
        if: matrix.kind == 'mac-intel'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AmbiGovee-Installer-macOS-Intel.zip
          if-no-files-found: error

      - name: Upload Linux installer
        if: matrix.kind == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AmbiGovee-Installer-Linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [meta, android, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail

          ls -lah release-assets
          test -s release-assets/AmbiGoveeTV.apk
          test -s release-assets/AmbiGovee-Installer-Windows.exe
          test -s release-assets/AmbiGovee-Installer-macOS-Apple-Silicon.zip
          test -s release-assets/AmbiGovee-Installer-macOS-Intel.zip
          test -s release-assets/AmbiGovee-Installer-Linux-x86_64.tar.gz

          cp installer/ambigovee_installer.py release-assets/ambigovee_installer.py
          cp release-assets/AmbiGoveeTV.apk "release-assets/AmbiGoveeTV-${TAG}.apk"

          (
            cd release-assets
            sha256sum \
              AmbiGoveeTV.apk \
              "AmbiGoveeTV-${TAG}.apk" \
              AmbiGovee-Installer-Windows.exe \
              AmbiGovee-Installer-macOS-Apple-Silicon.zip \
              AmbiGovee-Installer-macOS-Intel.zip \
              AmbiGovee-Installer-Linux-x86_64.tar.gz \
              ambigovee_installer.py \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            release-assets/AmbiGoveeTV.apk \
            "release-assets/AmbiGoveeTV-${TAG}.apk" \
            release-assets/AmbiGovee-Installer-Windows.exe \
            release-assets/AmbiGovee-Installer-macOS-Apple-Silicon.zip \
            release-assets/AmbiGovee-Installer-macOS-Intel.zip \
            release-assets/AmbiGovee-Installer-Linux-x86_64.tar.gz \
            release-assets/ambigovee_installer.py \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AmbiGoveeTV ${TAG}" \
            --generate-notes \
            --latest
