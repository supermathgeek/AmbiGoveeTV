plugins { id 'com.android.application' }

def releaseStore = System.getenv('AMBIGOVEE_KEYSTORE')
def releaseStorePassword = System.getenv('AMBIGOVEE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('AMBIGOVEE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('AMBIGOVEE_KEY_PASSWORD')
def updateRepo = project.findProperty('AMBIGOVEE_REPO') ?: 'supermathgeek/AmbiGoveeTV'

def escapedRepo = updateRepo.toString().replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'fr.ambigovee.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.ambigovee.tv'
        minSdk 21
        targetSdk 31
        versionCode 15
        versionName '1.5.0'
        buildConfigField 'String', 'UPDATE_REPO', '"' + escapedRepo + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
}
