plugins { id 'com.android.application' }

def releaseStore = System.getenv('AMBIGOVEE_KEYSTORE')
def releaseStorePassword = System.getenv('AMBIGOVEE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('AMBIGOVEE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('AMBIGOVEE_KEY_PASSWORD')

def updateRepo = project.findProperty('AMBIGOVEE_REPO') ?: 'supermathgeek/AmbiGoveeTV'
def escapedRepo = updateRepo.toString().replace('\\', '\\\\').replace('"', '\\"')

// En local/main on garde une version de developpement stable.
// Le workflow Release injecte automatiquement la vraie version et un versionCode monotone.
def appVersionCode = (project.findProperty('AMBIGOVEE_VERSION_CODE') ?: '17').toString().toInteger()
def appVersionName = (project.findProperty('AMBIGOVEE_VERSION_NAME') ?: '1.6.1').toString()

android {
    namespace 'fr.ambigovee.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.ambigovee.tv'
        minSdk 21
        targetSdk 34

        versionCode appVersionCode
        versionName appVersionName

        buildConfigField 'String', 'UPDATE_REPO', '"' + escapedRepo + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false

            // Une release publique doit etre signee par la cle definitive.
            if (releaseStore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // QR code généré entièrement en local pour l'association Philips via téléphone.
    implementation 'com.google.zxing:core:3.5.3'
}
